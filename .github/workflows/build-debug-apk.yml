name: Build debug APK

on:
  push:
    branches:
      - build/debug-apk-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-regression-tests:
    name: Accounting and UI regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for accounting regression tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm ci

      - name: Run accounting and UI regression tests
        run: npm test

  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          # yes may exit with SIGPIPE once sdkmanager has read enough answers.
          # Preserve sdkmanager's status, not yes's, under GitHub's bash -e -o pipefail.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains the updated app assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html | grep -Fq 'src/styles/235-hesabno-text-root-and-display-stability.css?v=2026102911'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/067-inline.js?v=2026102911'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/142-hesabno-check-settlement-date.js?v=25'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/144-hesabno-check-return-confirm.js?v=23'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/214-hesabno-numeric-keyboard.js?v=2026102801'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/225-hesabno-colorful-keypad.js?v=6'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{fontWeight:900}'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{fontSize:"9px"}'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{position:"fixed",left:0,right:0,bottom:0,marginLeft:"auto",marginRight:"auto",zIndex:1'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'inline-block align-middle text-stone-400 text-xs leading-none'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'Q.some(ae=>ae.id===y)?"z-40":"z-10"'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq '${ae.id===Q[Q.length-1].id?"bottom-9":"top-9"}'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'backdrop.style.alignItems = "flex-end"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.position = "fixed"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.bottom = "0px"'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'z6().createPortal(e.jsx(Nk,'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'paddingBottom:0,boxShadow:"0 -18px 48px rgba(0,0,0,.45)"'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'background:"rgba(2,6,23,.36)",touchAction:"none"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'backdrop.style.background = "rgba(2, 6, 23, 0.36)";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'overlay.style.background = "rgba(2, 6, 23, 0.36)";'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #hesabno-return-datepicker-backdrop {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'backdrop-filter: blur(24px) saturate(120%) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #persian-datepicker-sheet,'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'border: 2px solid rgba(148, 163, 184, .90) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq '#persian-datepicker-sheet > .w-10.h-1.rounded-full.mx-auto.mb-4 {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'visibility: hidden !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: linear-gradient(160deg, #202a38, #19212d) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'min-height: 40px !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #persian-datepicker-backdrop {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: rgba(2, 6, 23, .36) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'backdrop-filter: none !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: rgba(248, 250, 252, .42) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'height: min(62vh, 520px) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'border: 0 !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: rgba(2, 6, 23, .22) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: rgba(15, 23, 42, .18) !important;'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'className:"w-10 h-1 rounded-full mx-auto mb-4",style:{flex:"0 0 auto",marginTop:"auto"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.display = "flex";'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'footer.style.flex = "0 0 auto";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'picker.style.display = "flex";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'dateFooter.style.flex = "0 0 auto";'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'weekdays.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'calendarCard.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'height:"86vh"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.height = "86vh";'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'handle.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'picker.style.height = "86vh";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'dateHandle.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/214-hesabno-numeric-keyboard.js | grep -Fq 'pendingOutsideClick'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'id:"field-check-number-input",type:"text",inputMode:"numeric","data-hesabno-amount-keyboard-field":"false"'
          unzip -p "$APK" assets/src/scripts/225-hesabno-colorful-keypad.js | grep -Fq 'var isExcluded = /شماره|سریال|شناسه|'

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: my-money-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

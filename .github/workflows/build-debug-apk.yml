name: Build debug APK

on:
  push:
    branches:
      - build/debug-apk-workflow
      - arena/c34c8c3f-my-money-accounting
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-regression-tests:
    name: Accounting and UI regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for accounting regression tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm ci

      - name: Run accounting and UI regression tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/accounting-tests.log 2>&1
          test_status=$?
          cat /tmp/accounting-tests.log
          if [ "$test_status" -ne 0 ]; then
            grep -E '^not ok |^✖ ' /tmp/accounting-tests.log | while IFS= read -r failure; do
              echo "::error::$failure"
            done
          fi
          exit "$test_status"

  build-debug-apk:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[no-apk]')
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          # yes may exit with SIGPIPE once sdkmanager has read enough answers.
          # Preserve sdkmanager's status, not yes's, under GitHub's bash -e -o pipefail.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains the updated app assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html | grep -Fq 'src/styles/235-hesabno-text-root-and-display-stability.css?v=2026103014'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/067-inline.js?v=2026103008'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/000c-unpin-default-cash.js?v=2026103002'
          unzip -p "$APK" assets/src/scripts/000c-unpin-default-cash.js | grep -Fq 'hesabno:default_cash_unpinned_v2'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/108-hesabno-complete-reset-flow.js?v=21'
          unzip -p "$APK" assets/src/scripts/108-hesabno-complete-reset-flow.js | grep -Fq 'resetOnboardingState'
          unzip -p "$APK" assets/src/scripts/108-hesabno-complete-reset-flow.js | grep -Fq 'requestResetPin'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/239-hesabno-security-dialog-viewport.js?v=2'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/240-hesabno-numeric-text-auto-fit.js?v=1'
          unzip -p "$APK" assets/src/scripts/240-hesabno-numeric-text-auto-fit.js | grep -Fq 'data-hesabno-unified-number-font'
          unzip -p "$APK" assets/src/scripts/240-hesabno-numeric-text-auto-fit.js | grep -Fq 'MIN_FONT_SIZE'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'data-hesabno-security-settings'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'disabled:!hnSecurityPinReady&&!B'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq '✓ رمزها مطابقت دارند'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'data-hesabno-pin-visibility'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'justify-start overflow-y-auto no-scrollbar px-6'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'paddingBottom:"max(16px, env(safe-area-inset-bottom))"'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{marginTop:"auto"}'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'if(enabled&&!/^\d{4}$/.test(savedPin))'
          unzip -p "$APK" assets/src/scripts/239-hesabno-security-dialog-viewport.js | grep -Fq 'visualViewport'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'data-hesabno-security-card'
          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/142-hesabno-check-settlement-date.js?v=26'

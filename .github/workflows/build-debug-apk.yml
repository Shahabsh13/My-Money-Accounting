          unzip -p "$APK" assets/index.html | grep -Fq 'src/scripts/225-hesabno-colorful-keypad.js?v=6'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{fontWeight:900}'

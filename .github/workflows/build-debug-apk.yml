          unzip -p "$APK" assets/src/scripts/227-modal-scroll-lock.js | grep -Fq 'el.scrollWidth > el.clientWidth + 1'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'data-hesabno-account-icon-categories'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{fontSize:"9px"}'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'clamp(0.68rem, 2.7vw, 0.82rem)'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'style:{position:"fixed",left:0,right:0,bottom:0,marginLeft:"auto",marginRight:"auto",zIndex:1'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'inline-block align-middle text-stone-400 text-xs leading-none'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'Q.some(ae=>ae.id===y)?"z-40":"z-10"'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq '${ae.id===Q[Q.length-1].id?"bottom-9":"top-9"}'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'backdrop.style.alignItems = "flex-end"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.position = "fixed"'

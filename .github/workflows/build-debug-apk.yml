          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'dateHandle.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/214-hesabno-numeric-keyboard.js | grep -Fq 'pendingOutsideClick'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'id:"field-check-number-input",type:"text",inputMode:"numeric","data-hesabno-amount-keyboard-field":"false"'

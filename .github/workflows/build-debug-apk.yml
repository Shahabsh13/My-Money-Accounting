          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'background:"rgba(2,6,23,.36)",touchAction:"none"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'backdrop.style.background = "rgba(2, 6, 23, 0.36)";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'overlay.style.background = "rgba(2, 6, 23, 0.36)";'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #hesabno-return-datepicker-backdrop {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #persian-datepicker-sheet,'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #hesabno-return-datepicker-sheet {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'height: min(68vh, 580px) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body [data-hesabno-range-picker="true"] {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'height: min(76vh, 600px) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq '#persian-datepicker-sheet > .w-10.h-1.rounded-full.mx-auto.mb-4 {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'visibility: hidden !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: linear-gradient(160deg, #202a38, #19212d) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'min-height: 40px !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'html body #persian-datepicker-backdrop {'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: rgba(2, 6, 23, .36) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'backdrop-filter: none !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'background: rgba(248, 250, 252, .42) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'height: min(62vh, 520px) !important;'
          unzip -p "$APK" assets/src/styles/235-hesabno-text-root-and-display-stability.css | grep -Fq 'border: 0 !important;'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'className:"w-10 h-1 rounded-full mx-auto mb-4",style:{flex:"0 0 auto",marginTop:"auto"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.display = "flex";'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'footer.style.flex = "0 0 auto";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'picker.style.display = "flex";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'dateFooter.style.flex = "0 0 auto";'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'weekdays.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/144-hesabno-check-return-confirm.js | grep -Fq 'calendarCard.style.marginTop = "auto";'
          unzip -p "$APK" assets/src/scripts/067-inline.js | grep -Fq 'height:"86vh"'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'state.sheet.style.height = "86vh";'
          unzip -p "$APK" assets/src/scripts/142-hesabno-check-settlement-date.js | grep -Fq 'handle.style.marginTop = "auto";'
